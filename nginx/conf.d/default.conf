# =============================================================================
# SGCM - Configuration nginx
#   - Redirection HTTP -> HTTPS
#   - Terminaison TLS
#   - Sert le bundle React (SPA)
#   - Reverse proxy /api -> backend Node.js
# =============================================================================

# -----------------------------------------------------------------------------
# Redirection systématique HTTP -> HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# Serveur principal HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name _;

    # --- Certificats TLS (montés via volume nginx/certs) ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- Durcissement TLS ---
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;

    # --- En-têtes de sécurité ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Limite pour les uploads (à ajuster si besoin)
    client_max_body_size 10M;

    # --- Reverse proxy vers l'API Express ---
    # Toute requête /api/* est forwardée au service `app` (port 3000)
    location /api/ {
        proxy_pass         http://app:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts adaptés à une API
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Frontend React (SPA) ---
    root  /usr/share/nginx/html;
    index index.html;

    # Toutes les routes inconnues retournent index.html (routing React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés (hash dans le nom de fichier)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Compression ---
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
